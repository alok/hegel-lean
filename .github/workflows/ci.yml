name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * 1'
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build hegel_tests hegel_examples hegel_maciver_tests hegel_panic_probe hegel_concurrency_tests
      - name: Check native ABI
        run: python3 scripts/check_ffi.py
      - name: Check port inventory
        run: python3 scripts/check_port.py
      - name: Integration tests
        run: lake test
      - name: Panic safety regression
        run: python3 scripts/test_safety.py
      - name: Concurrency watchdog
        run: python3 scripts/test_concurrency.py
      - name: Preserve MacIver test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maciver-results-${{ matrix.os }}
          path: .lake/maciver-results.json
          if-no-files-found: error
      - name: Passing and deliberately failing examples
        shell: bash
        run: |
          lake exe hegel_examples
          set +e
          lake exe hegel_examples fail > failure.txt 2>&1
          status=$?
          set -e
          cat failure.txt
          test "$status" -eq 1
          grep -F 'n = 5' failure.txt
      - name: Downstream Lake dependency
        run: python3 scripts/test_downstream.py
